<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DeepCHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1621;--panel:#17212b;--panel2:#242f3d;--hover:#202b36;--text:#fff;--dim:#7f91a4;--accent:#2AABEE;--accent2:#1c93d1;--out:#2b5278;--in:#182533;--border:#0b1118;--star:#ffb300;--search:#242f3d;--glass:rgba(23,33,43,.9)}
html[data-theme="light"]{--bg:#dfe8ee;--panel:#fff;--panel2:#f1f3f5;--hover:#f1f3f5;--text:#0f0f0f;--dim:#707579;--out:#effdde;--in:#fff;--border:#e4e6eb;--star:#ffa000;--search:#f1f3f5;--glass:rgba(255,255,255,.9)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;height:100dvh}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
@keyframes screenIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#1d2a38,#0e1621 70%);z-index:100;animation:fade .3s}
.login.active{display:flex}
.login-box{width:100%;max-width:380px;text-align:center;animation:slideUp .5s}
.login-logo{font-size:52px;font-weight:800;letter-spacing:-2.5px;margin-bottom:12px;background:linear-gradient(135deg,#2AABEE,#59d1e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{color:var(--dim);font-size:15px;margin-bottom:36px}
.login input{width:100%;height:54px;background:var(--panel);border:1.5px solid var(--border);border-radius:14px;color:var(--text);padding:0 18px;font-size:16px;outline:none;text-align:center;font-family:ui-monospace,monospace;letter-spacing:1.2px;transition:border-color .2s}
.login input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(42,171,238,.15)}
.login button{width:100%;height:54px;margin-top:14px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;font-weight:600;transition:transform .12s}
.login button:active{transform:scale(.98)}
.login-err{color:#e17076;font-size:14px;margin-top:12px;min-height:18px}
.sidebar{width:380px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-header{display:flex;align-items:center;gap:8px;padding:0 10px;height:60px}
.hamburger{width:42px;height:42px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.hamburger:hover{background:var(--hover)}
.logo{flex:1;font-weight:700;font-size:18px;padding-left:6px}
.logo span{background:linear-gradient(135deg,var(--accent),#59d1e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.new-chat-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.new-chat-btn:active{transform:scale(.9)}
.search-wrap{position:relative;padding:6px 12px 10px}
.search{width:100%;height:46px;border-radius:12px;background:var(--search);color:var(--text);padding:0 16px 0 44px;font-size:16px;outline:none;border:1px solid transparent;transition:border-color .2s,background .2s}
.search:focus{border-color:var(--accent);background:var(--panel2)}
.search::placeholder{color:var(--dim)}
.search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:16px;pointer-events:none;margin-top:-2px}
.stories-bar{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story-circle{flex-shrink:0;text-align:center;width:70px;cursor:pointer;transition:transform .15s}
.story-circle:active{transform:scale(.94)}
.story-avatar{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ffb300,#e17076,#2AABEE);position:relative;margin:0 auto}
.story-avatar.seen{background:var(--panel2)}
.story-avatar.my{background:linear-gradient(135deg,#2AABEE,#59d1e6)}
.story-avatar>div{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:19px;border:2px solid var(--panel)}
.story-plus{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--panel);font-weight:700}
.story-name{font-size:11.5px;color:var(--dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chat-list{flex:1;overflow-y:auto;padding-bottom:8px}
.chat-list::-webkit-scrollbar{width:6px}
.chat-list::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
.chat-item{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center;transition:background .15s;animation:slideUp .25s both}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.chat-item.active .ci-preview,.chat-item.active .ci-time{color:rgba(255,255,255,.88)}
.avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;flex-shrink:0;position:relative;background-size:cover;background-position:center;overflow:hidden}
.avatar.sm{width:42px;height:42px;font-size:16px}
.avatar .online-dot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:50%;background:#4dd964;border:2.5px solid var(--panel)}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ci-name{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12.5px;color:var(--dim);flex-shrink:0}
.ci-preview{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:3px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;background:var(--panel2);color:var(--dim);margin-left:6px;vertical-align:middle;text-transform:uppercase;font-weight:600}
.badge.ch{background:linear-gradient(135deg,#ffb84d,#ff9800);color:#fff}
.badge.gr{background:linear-gradient(135deg,#7bc862,#4dd964);color:#fff}
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0;position:relative;animation:screenIn .3s}
.chat-header{display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;cursor:pointer;z-index:5;transition:background .2s}
.chat-header:active{background:var(--hover)}
.back{display:none;width:40px;height:40px;border-radius:50%;color:var(--accent);font-size:22px;align-items:center;justify-content:center}
.chat-title{flex:1;min-width:0}
.chat-title .name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title .status{font-size:13.5px;color:var(--accent);margin-top:1px;height:16px}
.messages{flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:4px}
.messages::-webkit-scrollbar{width:7px}
.messages::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:4px}
.msg{display:flex;max-width:78%;animation:pop .18s cubic-bezier(.2,1.3,.6,1);cursor:pointer}
.msg.out{align-self:flex-end}
.msg.in{align-self:flex-start}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.bubble{background:var(--in);padding:8px 13px;border-radius:16px;font-size:16.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(0,0,0,.12);position:relative;transition:transform .1s}
.msg:active .bubble{transform:scale(.98)}
.msg.in .bubble{border-bottom-left-radius:4px}
.msg.out .bubble{background:linear-gradient(135deg,var(--out),#2a4a6a);border-bottom-right-radius:4px}
html[data-theme="light"] .msg.out .bubble{background:linear-gradient(135deg,#dcf0ff,#effdde)}
.sender{font-size:13.5px;font-weight:700;margin-bottom:2px;color:var(--accent)}
.meta{float:right;font-size:11px;color:var(--dim);margin:6px -3px -2px 9px;opacity:.9}
.msg.out .meta{color:#9ec6f0}
.edited{font-size:10px;color:var(--dim);margin-left:4px;opacity:.7}
.typing .bubble{padding:14px 16px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin:0 2px;animation:blink 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1;transform:scale(1.3)}}
.msg.gift-centered{align-self:center;max-width:100%;justify-content:center;margin:16px 0;animation:giftIn .7s cubic-bezier(.34,1.56,.64,1);cursor:default}
.gift-bubble{background:linear-gradient(135deg,rgba(42,171,238,.15),rgba(255,179,0,.18));border:1px solid rgba(255,179,0,.4);border-radius:22px;padding:22px 30px 18px;text-align:center;min-width:240px;position:relative;overflow:hidden}
.gift-bubble::after{content:'';position:absolute;inset:1px;border-radius:22px;background:linear-gradient(135deg,rgba(23,33,43,.9),rgba(23,33,43,.75));z-index:0}
.gift-bubble>*{position:relative;z-index:1}
.gift-emoji{font-size:64px;line-height:1;animation:giftFloat 3s ease-in-out infinite;display:inline-block}
.gift-title{font-weight:800;font-size:20px;margin-top:12px;background:linear-gradient(90deg,#ffb300,#2AABEE,#ffb300);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:giftTitle 3s linear infinite}
.gift-sub{font-size:13.5px;color:var(--dim);margin-top:6px}
.gift-price{color:var(--star);font-size:17px;font-weight:800;margin-top:10px}
.gift-meta{display:block;text-align:center;font-size:11.5px;color:var(--dim);margin-top:8px}
@keyframes giftIn{0%{opacity:0;transform:scale(.2) translateY(40px)}60%{opacity:1;transform:scale(1.08) translateY(0)}100%{transform:scale(1)}}
@keyframes giftFloat{0%,25%,75%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-10deg)}75%{transform:translateY(-10px) rotate(10deg)}}
@keyframes giftTitle{from{background-position:0% 50%}to{background-position:200% 50%}}
.rec-overlay{position:fixed;left:10px;right:10px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:16px;z-index:900;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:slideUp .3s}
.rec-overlay .rec-top-row{display:flex;align-items:center;gap:12px}
.rec-overlay .dotl{width:12px;height:12px;border-radius:50%;background:#e17076;animation:blink 1s infinite}
.rec-overlay .tm{font-family:ui-monospace,monospace;font-size:18px;font-weight:700}
.rec-overlay .hint{color:var(--dim);font-size:14px;flex:1}
.rec-overlay .rec-btns{display:flex;gap:10px}
.rec-overlay button{flex:1;padding:15px;border-radius:14px;font-size:16px;font-weight:600;transition:transform .1s}
.rec-overlay button:active{transform:scale(.97)}
.rec-cancel{background:var(--panel2);color:var(--text)}
.rec-stop{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.voice-bubble{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;min-width:200px}
.play-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.waveform{flex:1;height:24px;display:flex;align-items:center;gap:2px;overflow:hidden}
.waveform i{display:block;width:2px;background:linear-gradient(180deg,var(--accent),var(--dim));border-radius:1px;opacity:.8}
.voice-time{font-size:13px;color:var(--dim);font-weight:500}
.circle-msg{width:230px;height:230px;border-radius:50%;overflow:hidden;position:relative;background:#000;border:3px solid var(--panel2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.circle-msg video{width:100%;height:100%;object-fit:cover;display:block}
.circle-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,0,0,.4),rgba(0,0,0,.1));color:#fff;font-size:40px;z-index:2}
.composer{display:flex;align-items:flex-end;gap:5px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);flex-shrink:0;border-top:1px solid var(--border)}
.icon-soft{width:40px;height:40px;border-radius:50%;color:var(--dim);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.icon-soft:hover{background:var(--hover);color:var(--accent)}
.field-wrap{flex:1;display:flex;align-items:center;background:var(--search);border-radius:22px;padding:2px 4px 2px 14px;min-width:0;border:1.5px solid transparent;transition:border-color .15s}
.field-wrap:focus-within{border-color:var(--accent)}
.composer input{flex:1;height:40px;background:transparent;border:none;color:var(--text);padding:0;font-size:17px;outline:none;min-width:0}
.composer input::placeholder{color:var(--dim)}
.send-btn,.circle-btn,.voice-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.send-btn:active,.circle-btn:active,.voice-btn:active{transform:scale(.9)}
.profile-screen{position:fixed;inset:0;background:var(--bg);z-index:400;display:none;flex-direction:column;overflow:hidden}
.profile-screen.active{display:flex;animation:screenIn .3s}
.prof-header{display:flex;align-items:center;gap:12px;height:60px;padding:0 12px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.prof-header-btn{width:40px;height:40px;border-radius:50%;color:var(--text);font-size:22px;display:flex;align-items:center;justify-content:center}
.prof-header-title{flex:1;font-weight:600;font-size:17px}
.prof-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.prof-cover{height:170px;background:linear-gradient(135deg,#2AABEE,#59d1e6);background-size:cover;background-position:center;position:relative}
.prof-cover-edit{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.prof-main{padding:0 20px 20px;position:relative;margin-top:-55px}
.prof-avatar-wrap{display:flex;align-items:flex-end;justify-content:space-between}
.prof-avatar{width:120px;height:120px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:600;border:5px solid var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.4);flex-shrink:0}
.prof-stars-badge{background:linear-gradient(135deg,#ffb300,#ff8c00);color:#fff;padding:8px 14px;border-radius:22px;font-size:15px;font-weight:800;margin-bottom:10px;animation:scaleIn .4s}
.prof-names{margin-top:14px;animation:slideUp .3s}
.prof-name{font-size:26px;font-weight:700}
.prof-username{color:var(--accent);font-size:16px;font-weight:500;margin-top:4px}
.prof-status{color:var(--dim);font-size:14.5px;margin-top:6px}
.prof-status .dot-online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4dd964;margin-right:6px}
.prof-info-cards{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;animation:slideUp .4s}
.prof-info-card{background:var(--panel2);border-radius:12px;padding:10px 14px;font-size:14px;flex:1;min-width:120px}
.prof-info-card .ic-label{color:var(--dim);font-size:11.5px;text-transform:uppercase;font-weight:700}
.prof-info-card .ic-val{margin-top:4px;font-weight:600;font-size:14px;font-family:ui-monospace,monospace}
.prof-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;animation:slideUp .5s}
.prof-action-btn{flex:1;min-width:130px;padding:13px;border-radius:12px;background:var(--panel2);color:var(--text);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.prof-action-btn:active{transform:scale(.97)}
.prof-action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.prof-action-btn.gift{background:linear-gradient(135deg,#ffb300,#ff8c00);color:#fff}
.prof-action-btn.danger{background:linear-gradient(135deg,#e17076,#c55258);color:#fff}
.prof-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:20px;animation:fade .4s}
.prof-tab{flex:1;text-align:center;padding:14px 8px;font-size:15px;font-weight:600;color:var(--dim);border-bottom:2.5px solid transparent;cursor:pointer;transition:color .2s,border-color .2s}
.prof-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.prof-tab-content{padding:16px 20px 40px;animation:slideUp .3s}
.prof-empty{text-align:center;color:var(--dim);font-size:14px;padding:40px 20px}
.post{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:12px;animation:slideUp .3s}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-head-info{flex:1}
.post-head-name{font-weight:600;font-size:15.5px}
.post-head-time{font-size:12px;color:var(--dim)}
.post-text{font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:10px}
.post-media{width:100%;border-radius:12px;margin-top:8px;display:block;max-height:500px;object-fit:cover}
.post-foot{display:flex;align-items:center;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;color:var(--dim)}
.post-like{cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-weight:600;transition:background .15s,color .15s}
.post-like:hover{background:var(--hover)}
.post-like.liked{color:#e17076}
.post-del{margin-left:auto;cursor:pointer;color:#e17076;font-weight:600;padding:5px 10px;border-radius:10px}
.gifts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.gift-cell{background:var(--panel2);border-radius:14px;padding:16px 10px;text-align:center;border:1px solid rgba(255,179,0,.2);animation:scaleIn .3s;cursor:pointer;transition:transform .12s}
.gift-cell:active{transform:scale(.96)}
.gift-cell.exchangeable{border-color:var(--accent);box-shadow:0 0 0 2px rgba(42,171,238,.15)}
.gift-cell .gc-emoji{font-size:44px;line-height:1}
.gift-cell .gc-name{font-size:13px;margin-top:8px;font-weight:600}
.gift-cell .gc-count{display:inline-block;margin-top:6px;background:linear-gradient(135deg,#ffb300,#ff8c00);color:#fff;font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:10px}
.gift-cell .gc-exchange{margin-top:8px;font-size:10.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.active{display:flex;animation:fade .2s}
.story-progress{display:flex;gap:3px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));position:absolute;top:0;left:0;right:0;z-index:10}
.story-progress-bar{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-progress-bar>div{height:100%;background:#fff;width:0}
.story-top{position:absolute;top:calc(20px + env(safe-area-inset-top));left:0;right:0;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10}
.story-top-avatar{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;border:2px solid rgba(255,255,255,.9)}
.story-top-name{color:#fff;font-weight:600;font-size:15px;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.story-media{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:scaleIn .3s}
.story-media img,.story-media video{max-width:100%;max-height:100%;object-fit:contain}
.story-nav{position:absolute;top:0;bottom:0;width:30%;z-index:5;cursor:pointer}

.story-nav.right{right:0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:500;animation:fade .2s}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp .3s cubic-bezier(.2,1.1,.6,1)}
.modal h3{font-size:21px;font-weight:700;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea{width:100%;background:var(--panel2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s}
.field textarea{min-height:80px;resize:vertical;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.color-swatch:active{transform:scale(.9)}
.color-swatch.sel{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.btn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:600;margin-top:8px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-ghost{background:var(--panel2);color:var(--text)}
.btn-danger{background:linear-gradient(135deg,#e17076,#c55258);color:#fff}
.avatar-picker{width:110px;height:110px;border-radius:50%;background:var(--panel2);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--dim);cursor:pointer;background-size:cover;background-position:center;overflow:hidden;border:2.5px dashed var(--border);transition:border-color .2s}
.banner-picker{width:100%;height:100px;border-radius:12px;background:var(--panel2);margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--dim);cursor:pointer;background-size:cover;background-position:center;overflow:hidden;border:2.5px dashed var(--border)}
.member-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer}
.member-row:hover{background:var(--hover)}
.member-row .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:transparent;transition:all .15s}
.member-row.sel .chk{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.member-row .nm{flex:1;font-size:15px}
.type-btns{display:flex;gap:12px;margin-bottom:16px}
.type-btn{flex:1;padding:16px 10px;border-radius:14px;background:var(--panel2);border:2px solid transparent;text-align:center;font-size:14px;transition:all .15s}

.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.gift-card{background:var(--panel2);border-radius:14px;padding:14px 8px;text-align:center;border:2px solid transparent;cursor:pointer;transition:transform .12s}
.gift-card:active{transform:scale(.95)}

.stars-line{display:flex;align-items:center;gap:6px;justify-content:center;font-size:17px;margin-bottom:18px;color:var(--star);font-weight:700}
.msg-actions{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:20px 20px 0 0;padding:16px;z-index:600;animation:slideUp .25s;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.msg-actions button{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:12px;font-size:16px;text-align:left;transition:background .15s}
.msg-actions button:hover{background:var(--hover)}
.msg-actions button.danger{color:#e17076}
.msg-actions .icon{font-size:20px;width:24px;text-align:center}
.exchange-preview{background:linear-gradient(135deg,rgba(42,171,238,.1),rgba(255,179,0,.1));border:1px solid rgba(42,171,238,.3);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
.exchange-preview .big-emoji{font-size:52px}
.exchange-preview .row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;color:var(--dim)}
.exchange-preview .row b{color:var(--text)}
.exchange-preview .commission{color:#e17076}
.exchange-preview .youget{color:var(--star);font-size:20px;font-weight:800;margin-top:10px}
.code-row{display:flex;align-items:center;gap:10px;padding:11px;background:var(--panel2);border-radius:12px;margin-bottom:8px;font-size:14px}
.code-row code{font-family:ui-monospace,monospace;font-size:12.5px;flex:1;word-break:break-all}
.tag{font-size:10.5px;padding:2px 8px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
.tag.ban{background:#e17076}
.tag.admin{background:#ffb84d;color:#000}
.code-row button{padding:6px 11px;border-radius:9px;background:var(--panel);color:var(--text);font-size:12px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;font-weight:600;transition:all .35s cubic-bezier(.2,1.2,.6,1);z-index:1200;pointer-events:none;opacity:0;max-width:80%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-size:11px;gap:3px;font-weight:500;transition:color .2s,transform .2s}
.tab-btn.active{color:var(--accent);transform:translateY(-2px)}
.tab-btn .icon{font-size:22px;line-height:1;transition:transform .2s}
.tab-btn.active .icon{transform:scale(1.15)}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px;text-align:center;padding:30px}
.empty-state{padding:40px 20px;text-align:center;color:var(--dim);font-size:14.5px;line-height:1.7}
@media(max-width:768px){
  .sidebar{width:100%;min-width:0;border-right:none;padding-bottom:62px}
  .chat{display:none;position:fixed;inset:0;z-index:50;padding-bottom:62px}
  body.chat-open .chat{display:flex}
  body.chat-open .sidebar{display:none}
  body.chat-open .tab-bar{display:none}
  .back{display:flex}
  .msg{max-width:86%}
  .tab-bar{display:flex}
  .circle-msg{width:200px;height:200px}
}
/* === АНИМИРОВАННЫЕ СТИКЕРЫ === */
.msg.sticker-msg{max-width:none;align-self:center;background:none;padding:14px 0;box-shadow:none;cursor:pointer;position:relative;display:flex;justify-content:center;animation:stickerIn .4s cubic-bezier(.34,1.56,.64,1)}
.sticker-body{font-size:88px;line-height:1;display:inline-block;transition:transform .15s;filter:drop-shadow(0 6px 16px rgba(0,0,0,.3))}
.sticker-msg:active .sticker-body{transform:scale(.92)}
.sticker-msg .sticker-meta{position:absolute;bottom:0;right:calc(50% - 70px);font-size:10px;color:var(--dim);opacity:.6;font-weight:500}
@keyframes stickerIn{0%{opacity:0;transform:scale(.3) rotate(-15deg)}70%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes stBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes stSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes stWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
@keyframes stPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes stHeart{0%,100%{transform:scale(1)}14%,28%{transform:scale(1.22)}42%{transform:scale(1)}70%{transform:scale(1.15)}}
@keyframes stFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes stShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes stTada{0%{transform:scale(1) rotate(0)}10%,20%{transform:scale(.9) rotate(-6deg)}30%,50%,70%{transform:scale(1.18) rotate(6deg)}40%,60%,80%{transform:scale(1.18) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes stJump{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-22px) scale(1.05)}}
@keyframes stSwing{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}}
.anim-bounce{animation:stBounce 1s ease-in-out infinite}
.anim-spin{animation:stSpin 2s linear infinite}
.anim-wiggle{animation:stWiggle .8s ease-in-out infinite}
.anim-pulse{animation:stPulse 1s ease-in-out infinite}
.anim-heart{animation:stHeart 1.2s ease-in-out infinite}
.anim-float{animation:stFloat 2s ease-in-out infinite}
.anim-shake{animation:stShake .6s ease-in-out infinite}
.anim-tada{animation:stTada 1.5s ease-in-out infinite}
.anim-jump{animation:stJump 1s ease-in-out infinite}
.anim-swing{animation:stSwing 1s ease-in-out infinite}
.sticker-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:360px;overflow-y:auto;padding:4px}
.sticker-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:46px;background:var(--panel2);border-radius:14px;cursor:pointer;transition:transform .12s,background .12s}
.sticker-cell:active{transform:scale(.88)}
.sticker-cell:hover{transform:scale(1.06);background:var(--hover)}
</style>
</head>
<body>

<div class="login active" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">DeepCHAT</div>
    <div class="login-sub">Введите свой код доступа</div>
    <input id="codeInput" type="text" placeholder="DEEP-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <button id="loginBtn">Войти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <header class="side-header">
      <button class="hamburger" id="menuBtn">☰</button>
      <div class="logo">Deep<span>CHAT</span></div>
      <button class="new-chat-btn" id="newChatBtn">✏️</button>
    </header>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search" id="search" placeholder="Поиск по @юзернейму, имени или коду">
    </div>

  <main class="chat" id="chatView">
    <header class="chat-header" id="chatHeader" style="display:none">

      </div>
    </header>

    <div class="composer" id="composer" style="display:none">
      <button class="icon-soft" id="giftBtn">🎁</button>
      <button class="icon-soft" id="attachBtn">📎</button>
      <button class="icon-soft" id="stickerBtn">😀</button>
      <div class="field-wrap">
        <input id="msgInput" placeholder="Сообщение" autocomplete="off">
      </div>
      <button class="voice-btn" id="voiceBtn">🎤</button>

    <button class="tab-btn" data-tab="groups"><span class="icon">👥</span>Группы</button>
    <button class="tab-btn" data-tab="search"><span class="icon">🔍</span>Поиск</button>

</div>

<div class="profile-screen" id="profileScreen">

    <button class="prof-header-btn" id="profBack">←</button>

</div>

<div class="story-viewer" id="storyViewer">
  <div class="story-progress" id="storyProgress"></div>
  <div class="story-top">
    <div class="story-top-avatar" id="storyTopAvatar"></div>
    <div class="story-top-name" id="storyTopName"></div>
    <button class="story-close" id="storyClose">✕</button>
  </div>
  <div class="story-nav left" id="storyPrev"></div>
  <div class="story-nav right" id="storyNext"></div>
  <div class="story-media" id="storyMedia"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return document.querySelectorAll(s); };
var TOKEN_KEY = 'deepchat_token';
var token = localStorage.getItem(TOKEN_KEY) || '';
var me = null, users = [], chats = [], gifts = [], stories = [];
var activeChat = null, activeTab = 'chats';
var ws = null, typingTimer = null;
var mediaRecorder = null, chunks = [], recTimer = null, recSec = 0, recStream = null;
var editingMessageId = null;
var GIFT_COMMISSION = 0.30;
var COLORS = ['#2AABEE','#7bc862','#e17076','#65aadd','#a695e7','#ee7aae','#ffb84d','#4dc9b0'];
var blobCache = {};
var currentStoryList = [], currentStoryIndex = 0, storyTimer = null;

var STICKERS = [
  {e:'😀',a:'bounce'},{e:'😂',a:'shake'},{e:'😍',a:'heart'},{e:'🥳',a:'tada'},
  {e:'😎',a:'float'},{e:'🤔',a:'pulse'},{e:'😴',a:'float'},{e:'😢',a:'shake'},
  {e:'😡',a:'shake'},{e:'🔥',a:'pulse'},{e:'❤️',a:'heart'},{e:'✨',a:'spin'},
  {e:'🌟',a:'pulse'},{e:'⭐',a:'spin'},{e:'💎',a:'pulse'},{e:'🎉',a:'tada'},
  {e:'🎁',a:'bounce'},{e:'🚀',a:'float'},{e:'🍕',a:'bounce'},{e:'☕',a:'pulse'},
  {e:'🌈',a:'float'},{e:'💯',a:'bounce'},{e:'👑',a:'pulse'},{e:'🏆',a:'tada'},
  {e:'🐱',a:'wiggle'},{e:'🐶',a:'jump'},{e:'🦄',a:'swing'},{e:'🐸',a:'bounce'}
];

function dataUrlToBlobUrl(dataUrl){
  if(!dataUrl) return '';
  if(blobCache[dataUrl]) return blobCache[dataUrl];
  try {
    var parts = dataUrl.split(',');
    var mime = parts[0].match(/:(.*?);/)[1];
    var bin = atob(parts[1]);
    var len = bin.length;
    var arr = new Uint8Array(len);
    for(var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: mime }));
    blobCache[dataUrl] = url;
    return url;
  } catch(e) { return dataUrl; }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(n){ var p = String(n || '?').trim().split(/\s+/); return ((p[0]?p[0][0]:'') + (p[1]?p[1][0]:'')).toUpperCase() || '?'; }
function fmtTime(ts){ var d = new Date(ts), n = new Date(); var hm = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); if(d.toDateString() === n.toDateString()) return hm; return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2); }
function fmtLast(ts){ if(!ts) return 'недавно'; var diff = (Date.now() - ts) / 1000; if(diff < 60) return 'только что'; if(diff < 3600) return Math.floor(diff/60)+' мин назад'; if(diff < 86400) return Math.floor(diff/3600)+' ч назад'; return fmtTime(ts); }
function fmtDur(s){ s = Math.round(s); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
function api(p, m, b){ return fetch('/api'+p, { method: m || 'GET', headers: { 'Content-Type':'application/json', 'x-token':token }, body: b ? JSON.stringify(b) : undefined }).then(function(r){ return r.json(); }); }
function pickAudioMime(){ var c = ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm']; for(var i=0;i<c.length;i++){ try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} } return ''; }
function stickerAnimClass(a){ return 'anim-' + (a || 'bounce'); }
function openStickerPicker(toId){
  if(!toId){ toast('Выберите чат'); return; }
  var ov = document.createElement('div'); ov.className = 'modal-bg';
  ov.innerHTML = '<div class="modal" style="max-width:400px"><h3>😀 Стикеры</h3>' +
    '<div class="sticker-panel" id="stkGrid"></div>' +
    '<button class="btn btn-ghost" id="stkClose">Закрыть</button></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
  ov.querySelector('#stkClose').onclick = function(){ ov.remove(); };
  var grid = ov.querySelector('#stkGrid');
  grid.innerHTML = STICKERS.map(function(s, i){
    return '<div class="sticker-cell" data-i="' + i + '"><span class="' + stickerAnimClass(s.a) + '" style="display:inline-block">' + s.e + '</span></div>';
  }).join('');
  grid.addEventListener('click', function(e){
    var cell = e.target.closest('.sticker-cell'); if(!cell) return;
    var st = STICKERS[Number(cell.dataset.i)]; if(!st) return;
    if(!ws || ws.readyState !== 1){ toast('Нет соединения'); return; }
    ws.send(JSON.stringify({ type:'send', to: toId, text: st.e, mediaType: 'sticker:' + st.a }));
    ov.remove();
  });
}

$('#loginBtn').addEventListener('click', doLogin);
$('#codeInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
function doLogin(){
  var code = $('#codeInput').value.trim().toUpperCase();
  if(!code) return;
  $('#loginErr').textContent = '';
  api('/login', 'POST', { code: code }).then(function(r){
    if(!r.ok){ $('#loginErr').textContent = r.error || 'Ошибка'; return; }
    token = r.token;
    localStorage.setItem(TOKEN_KEY, token);
    me = r.user; gifts = r.gifts || []; GIFT_COMMISSION = r.commission || 0.30;
    startApp();
  }).catch(function(){ $('#loginErr').textContent = 'Сеть недоступна'; });
}
function logout(){ api('/logout', 'POST').catch(function(){}); localStorage.removeItem(TOKEN_KEY); location.reload(); }
function startApp(){
  $('#loginScreen').classList.remove('active');
  $('#loginScreen').style.display = 'none';
  $('#app').classList.remove('hidden');
  $('#tabBar').style.display = 'flex';
  connectWS(); loadData();
}
function connectWS(){
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = function(){ ws.send(JSON.stringify({ type:'auth', token: token })); };
  ws.onmessage = function(e){
    var m; try { m = JSON.parse(e.data); } catch(err){ return; }
    if(m.type === 'message') onNewMessage(m.message);
    else if(m.type === 'presence') onPresence(m.code, m.online);
    else if(m.type === 'user_update') onUserUpdate(m.user);
    else if(m.type === 'user_update_public') onUserUpdate(m.user);
    else if(m.type === 'chats_changed') loadData();
    else if(m.type === 'typing') onTyping(m.from, m.to);
    else if(m.type === 'message_edit') onMessageEdit(m.message);
    else if(m.type === 'message_delete') onMessageDelete(m.id);
    else if(m.type === 'post_new' || m.type === 'post_update' || m.type === 'post_del') loadData();
  };
  ws.onclose = function(){ setTimeout(connectWS, 2000); };
  ws.onerror = function(){};
}
function loadData(){
  api('/users').then(function(r){
    if(!r.ok){ logout(); return; }
    me = r.me; users = r.users; chats = r.chats || []; gifts = r.gifts || []; stories = r.stories || [];

    document.getElementById('recStop').onclick = function(){ stopVoice(true); };
  }).catch(function(err){ toast('Нет доступа: ' + err.message); });
});
function stopVoice(send){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder._send = !!send;
    if(!send){ mediaRecorder.onstop = function(){ recStream && recStream.getTracks().forEach(function(t){ t.stop(); }); cleanupRec(); }; }
    try { mediaRecorder.stop(); } catch(e){ cleanupRec(); }
  } else { cleanupRec(); }
}
function cleanupRec(){ clearInterval(recTimer); var ov = document.getElementById('recOverlay'); if(ov) ov.remove(); mediaRecorder = null; recStream = null; chunks = []; recSec = 0; }

function loadProfileContent(code, isMe){
  var el = $('#profContent');
  if(profileTab === 'posts'){
    api('/posts/' + encodeURIComponent(code)).then(function(r){
      var posts = r.posts || [];
      if(!posts.length){ el.innerHTML = '<div class="prof-empty">' + (isMe ? 'У вас нет публикаций' : 'Публикаций нет') + '</div>'; return; }
      el.innerHTML = posts.map(function(p){ return postHTML(p, isMe); }).join('');
      el.querySelectorAll('.post-like').forEach(function(btn){
        btn.onclick = function(){ api('/posts/' + btn.dataset.pid + '/like', 'POST').then(function(r){ if(r.ok){ btn.classList.toggle('liked'); btn.querySelector('.lc').textContent = (r.post.likes || []).length; } }); };
      });
      el.querySelectorAll('.post-del').forEach(function(btn){
        btn.onclick = function(){ if(!confirm('Удалить?')) return; api('/posts/' + btn.dataset.pid, 'DELETE').then(function(){ btn.closest('.post').remove(); }); };
      });
    });
  } else {
    api('/gifts/' + encodeURIComponent(code)).then(function(r){
      if(r.commission) GIFT_COMMISSION = r.commission;
      var g = r.gifts || [];
      if(!g.length){ el.innerHTML = '<div class="prof-empty">' + (isMe ? 'У вас нет подарков' : 'Подарков нет') + '</div>'; return; }
      var grouped = {};
      g.forEach(function(x){
        if(!grouped[x.giftId]) grouped[x.giftId] = { gift: x.gift, instances: [], froms: [] };
        grouped[x.giftId].instances.push(x);
        if(x.fromUser) grouped[x.giftId].froms.push(x.fromUser);
      });
      el.innerHTML = '<div class="gifts-grid">' + Object.keys(grouped).map(function(id){
        var it = grouped[id];
        var fromNames = it.froms.map(function(f){ return f.name; }).filter(function(v, i, a){ return a.indexOf(v) === i; }).slice(0, 3).join(', ');
        var exchangeable = isMe ? ' exchangeable' : '';
        return '<div class="gift-cell' + exchangeable + '" data-gift="' + id + '" data-count="' + it.instances.length + '" title="От: ' + esc(fromNames) + '">' +
          '<div class="gc-emoji">' + it.gift.emoji + '</div><div class="gc-name">' + esc(it.gift.name) + '</div><div class="gc-count">×' + it.instances.length + '</div>' +
          (isMe ? '<div class="gc-exchange">Обменять</div>' : '') + '</div>';
      }).join('') + '</div>';
      if(isMe){
        el.querySelectorAll('.gift-cell').forEach(function(cell){
          cell.onclick = function(){
            var giftId = cell.dataset.gift;
            openGiftExchange(code, giftId);
          };
        });
      }
    });
  }
}

function openGiftExchange(ownerCode, giftId){
  api('/gifts/' + encodeURIComponent(ownerCode)).then(function(r){
    var all = (r.gifts || []).filter(function(g){ return g.giftId === giftId; });
    if(!all.length){ toast('Подарков нет'); return; }
    var giftDef = all[0].gift;
    var unitReturn = Math.floor(giftDef.price * (1 - GIFT_COMMISSION));
    var commissionAmount = giftDef.price - unitReturn;
    var totalReturn = unitReturn * all.length;
    var ov = document.createElement('div'); ov.className = 'modal-bg';
    ov.innerHTML = '<div class="modal" style="max-width:420px">' +
      '<h3>Обменять подарок</h3>' +
      '<div class="exchange-preview">' +
        '<div class="big-emoji">' + giftDef.emoji + '</div>' +
        '<div style="font-weight:700;font-size:17px;margin-top:6px">' + esc(giftDef.name) + '</div>' +
        '<div style="color:var(--dim);font-size:13px;margin-top:4px">У тебя: ×' + all.length + '</div>' +
        '<div class="row" style="margin-top:14px"><span>Цена подарка</span><b>⭐ ' + giftDef.price + '</b></div>' +
        '<div class="row"><span>Комиссия ' + Math.round(GIFT_COMMISSION * 100) + '%</span><b class="commission">− ' + commissionAmount + ' ⭐</b></div>' +
        '<div class="row"><span>Ты получишь за 1 шт.</span><b>⭐ ' + unitReturn + '</b></div>' +
        '<div class="row" style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px"><span>Итого за ×' + all.length + '</span><b style="font-size:18px">⭐ ' + totalReturn + '</b></div>' +
      '</div>' +
      '<div class="field"><label>Сколько обменять?</label><input id="exCount" type="number" min="1" max="' + all.length + '" value="1"></div>' +
      '<button class="btn btn-primary" id="exConfirm">⭐ Обменять</button>' +
      '<button class="btn btn-ghost" id="exCancel">Отмена</button></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
    ov.querySelector('#exCancel').onclick = function(){ ov.remove(); };
    var countInput = ov.querySelector('#exCount');
    var totalRow = ov.querySelector('.row:last-child b');
    countInput.addEventListener('input', function(){
      var n = Math.max(1, Math.min(all.length, Number(countInput.value) || 1));
      totalRow.textContent = '⭐ ' + (unitReturn * n);
    });
    ov.querySelector('#exConfirm').onclick = function(){
      var n = Math.max(1, Math.min(all.length, Number(countInput.value) || 1));
      var toExchange = all.slice(0, n);
      var done = 0;
      var chain = Promise.resolve();
      toExchange.forEach(function(g){
        chain = chain.then(function(){
          return api('/gifts/exchange', 'POST', { giftInstanceId: g.id }).then(function(r){
            if(r.ok){ done++; if(r.user) me = Object.assign({}, me, r.user); }
          });
        });
      });
      chain.then(function(){
        toast('Обменяно ×' + done + ' на ⭐' + (unitReturn * done));
        ov.remove();
        loadData();
        setTimeout(function(){ openProfile(me.code, true); }, 300);
      });
    };
  });
}

  overlay.innerHTML = '<div class="modal"><h3>Создать</h3><div class="type-btns"><div class="type-btn sel" data-type="channel"><span class="ico">📢</span>Канал</div><div class="type-btn" data-type="group"><span class="ico">👥</span>Группа</div></div>' +
    '<div class="field"><label>Название</label><input id="ncName" maxlength="50" placeholder="Например, Друзья"></div>' +
    '<div class="field"><label>Аватар</label><div class="avatar-picker" id="ncAvatar">📷</div></div>' +
    '<div class="field" id="ncMembersField" style="display:none"><label>Участники</label><div id="ncMembers" style="max-height:220px;overflow-y:auto"></div></div>' +
    '<button class="btn btn-primary" id="ncCreate">Создать</button><button class="btn btn-ghost" id="ncCancel">Отмена</button></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.remove(); });
  var type = 'channel', avatar = null, selected = {};
  overlay.querySelectorAll('.type-btn').forEach(function(b){
    b.onclick = function(){
      overlay.querySelectorAll('.type-btn').forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel'); type = b.dataset.type;
      overlay.querySelector('#ncMembersField').style.display = type === 'group' ? 'block' : 'none';
    };
  });
  var avEl = overlay.querySelector('#ncAvatar');
  avEl.onclick = function(){ pickAvatar(function(d){ avatar = d; avEl.style.backgroundImage = 'url(' + d + ')'; avEl.style.borderStyle = 'solid'; avEl.textContent = ''; }); };
  var mEl = overlay.querySelector('#ncMembers');
  mEl.innerHTML = users.filter(function(u){ return u.code !== me.code; }).map(function(u){
    return '<div class="member-row" data-c="' + esc(u.code) + '"><div class="chk">✓</div><div class="nm">' + esc(u.name) + ' <span style="color:var(--dim);font-size:12.5px">@' + esc(u.username) + '</span></div></div>';
  }).join('');
  mEl.addEventListener('click', function(e){
    var r = e.target.closest('.member-row'); if(!r) return;
    r.classList.toggle('sel');
    if(r.classList.contains('sel')) selected[r.dataset.c] = true; else delete selected[r.dataset.c];
  });
  overlay.querySelector('#ncCancel').onclick = function(){ overlay.remove(); };
  overlay.querySelector('#ncCreate').onclick = function(){
    var name = overlay.querySelector('#ncName').value.trim();
    if(!name) return toast('Введите название');
    api('/chats', 'POST', { type: type, name: name, avatar: avatar, members: Object.keys(selected) }).then(function(r){
      if(!r.ok) return toast(r.error || 'Ошибка');
      overlay.remove(); toast('Создано'); loadData();
      setTimeout(function(){ openChat(r.chat.id); }, 300);
    });
  };
}

$('#chatHeader').addEventListener('click', function(e){
  if(e.target.closest('#backBtn')) return;
  var u = users.find(function(x){ return x.code === activeChat; });
  var c = chats.find(function(x){ return x.id === activeChat; });
  if(u) openProfile(u.code);
  else if(c) openChatInfo(c);
});
function openChatInfo(c){
  var isCreator = c.creator === me.code || me.isAdmin;
  var ov = document.createElement('div'); ov.className = 'modal-bg';
  var avData = c.avatar; var selected = {}; (c.members || []).forEach(function(x){ selected[x] = true; });
  var membersHtml = c.type === 'group' ? '<div class="field"><label>Участники</label><div id="ciMembers" style="max-height:220px;overflow-y:auto"></div></div>' : '';
  ov.innerHTML = '<div class="modal"><h3>' + esc(c.name) + '</h3><div class="avatar-picker" id="ciAvatar" style="' + (c.avatar ? 'background-image:url(' + c.avatar + ');border-style:solid;' : '') + '">' + (c.avatar ? '' : (c.type === 'channel' ? '📢' : '👥')) + '</div>' +
    (isCreator ? '<div class="field"><label>Название</label><input id="ciName" maxlength="50" value="' + esc(c.name) + '"></div>' : '') +
    membersHtml +
    (isCreator ? '<button class="btn btn-primary" id="ciSave">Сохранить</button>' : '') +
    (c.type === 'group' && !isCreator ? '<button class="btn btn-danger" id="ciLeave">Выйти</button>' : '') +
    (isCreator ? '<button class="btn btn-danger" id="ciDelete">Удалить</button>' : '') +
    '<button class="btn btn-ghost" id="ciClose">Закрыть</button></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
  ov.querySelector('#ciClose').onclick = function(){ ov.remove(); };
  var avEl = ov.querySelector('#ciAvatar');
  if(isCreator) avEl.onclick = function(){ pickAvatar(function(d){ avData = d; avEl.style.backgroundImage = 'url(' + d + ')'; avEl.style.borderStyle = 'solid'; avEl.textContent = ''; }); };
  if(c.type === 'group'){
    var mEl = ov.querySelector('#ciMembers');
    mEl.innerHTML = users.filter(function(u){ return u.code !== me.code; }).map(function(u){
      var sel = selected[u.code] ? ' sel' : '';
      var cr = u.code === c.creator ? ' <span style="color:#ffb84d;font-size:10px;font-weight:700">АДМИН</span>' : '';
      return '<div class="member-row' + sel + '" data-c="' + esc(u.code) + '"><div class="chk">✓</div><div class="nm">' + esc(u.name) + cr + '</div></div>';
    }).join('');
    if(isCreator) mEl.addEventListener('click', function(e){
      var r = e.target.closest('.member-row'); if(!r) return;
      if(r.dataset.c === c.creator) return;
      r.classList.toggle('sel');
      if(r.classList.contains('sel')) selected[r.dataset.c] = true; else delete selected[r.dataset.c];
    });
  }
  var sb = ov.querySelector('#ciSave');
  if(sb) sb.onclick = function(){
    var name = ov.querySelector('#ciName').value.trim();
    var pl = { name: name, avatar: avData };
    if(c.type === 'group') pl.members = Object.keys(selected);
    api('/chats/' + c.id + '/update', 'POST', pl).then(function(r){
      if(!r.ok) return toast(r.error || 'Ошибка');
      toast('Сохранено'); ov.remove(); loadData();
    });
  };
  var lb = ov.querySelector('#ciLeave');
  if(lb) lb.onclick = function(){ if(!confirm('Выйти?')) return; api('/chats/' + c.id + '/leave', 'POST').then(function(){ toast('Вы вышли'); ov.remove(); document.body.classList.remove('chat-open'); activeChat = null; loadData(); }); };
  var db = ov.querySelector('#ciDelete');
  if(db) db.onclick = function(){ if(!confirm('Удалить?')) return; api('/chats/' + c.id, 'DELETE').then(function(){ toast('Удалено'); ov.remove(); document.body.classList.remove('chat-open'); activeChat = null; loadData(); }); };
}

$('#giftBtn').addEventListener('click', function(){
  if(!activeChat) return;
  var u = users.find(function(x){ return x.code === activeChat; });
  if(!u){ toast('Подарки только в личке'); return; }
  openGiftPicker(u.code);
});
function openGiftPicker(toCode){
  var ov = document.createElement('div'); ov.className = 'modal-bg';
  var starsStr = me.stars === 'inf' ? '∞' : me.stars;
  var selfText = (toCode === me.code) ? ' (себе)' : '';
  ov.innerHTML = '<div class="modal" style="max-width:400px"><h3>🎁 Подарок' + selfText + '</h3><div class="stars-line">⭐ Ваши звёзды: ' + starsStr + '</div><div class="gift-grid" id="gg"></div><button class="btn btn-primary" id="gSend" disabled>Отправить</button><button class="btn btn-ghost" id="gClose">Закрыть</button></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
  ov.querySelector('#gClose').onclick = function(){ ov.remove(); };
  var selectedId = null;
  var grid = ov.querySelector('#gg');
  grid.innerHTML = gifts.map(function(g){ return '<div class="gift-card" data-id="' + g.id + '"><div class="ge">' + g.emoji + '</div><div class="gn">' + esc(g.name) + '</div><div class="gp">⭐ ' + g.price + '</div></div>'; }).join('');
  grid.addEventListener('click', function(e){
    var c = e.target.closest('.gift-card'); if(!c) return;
    grid.querySelectorAll('.gift-card').forEach(function(x){ x.classList.remove('sel'); });
    c.classList.add('sel'); selectedId = c.dataset.id;
    ov.querySelector('#gSend').disabled = false;
  });
  ov.querySelector('#gSend').onclick = function(){
    if(!selectedId) return;
    api('/gifts/send', 'POST', { to: toCode, giftId: selectedId }).then(function(r){
      if(!r.ok) return toast(r.error || 'Ошибка');
      me = r.user; toast('Подарок отправлен!'); ov.remove(); loadData();
    });
  };
}

function openAdmin(){
  api('/admin/codes').then(function(r){
    if(!r.ok){ toast('Нет доступа'); return; }
    var ov = document.createElement('div'); ov.className = 'modal-bg';
    var codes = Object.entries(r.codes).sort(function(a, b){ return (b[1].createdAt || 0) - (a[1].createdAt || 0); });
    var rows = codes.map(function(en){
      var code = en[0], c = en[1], tags = '';
      if(c.isAdmin) tags += '<span class="tag admin">ADMIN</span>';
      if(c.banned) tags += '<span class="tag ban">БАН</span>';
      var u = r.users[code];
      var starsVal = u ? (u.stars === 'inf' ? '∞' : (u.stars || 0)) : '—';
      return '<div class="code-row"><div style="flex:1;min-width:0"><code>' + esc(code) + '</code><div style="font-size:11.5px;color:var(--dim);margin-top:3px">' + esc(c.name) + ' @' + esc(c.username || '') + ' ⭐' + starsVal + ' ' + tags + '</div></div><button data-act="ban" data-code="' + esc(code) + '">' + (c.banned ? 'Разбан' : 'Бан') + '</button><button data-act="del" data-code="' + esc(code) + '">Удалить</button></div>';
    }).join('');
    ov.innerHTML = '<div class="modal"><h3>🛡 Админ-панель</h3><div style="color:var(--dim);font-size:12.5px;margin-bottom:16px">Кодов: ' + codes.length + ' · Сообщений: ' + r.messageCount + ' · Подарков: ' + r.giftsCount + '</div><div id="aCodes">' + rows + '</div>' +
      '<div class="field" style="margin-top:16px"><label>Имя нового пользователя</label><input id="aName" placeholder="Иван"></div><button class="btn btn-primary" id="aCreate">➕ Создать код</button>' +
      '<div class="field" style="margin-top:16px"><label>Выдать звёзды</label><input id="aStarCode" placeholder="DEEP-..."><input id="aStarAmt" type="number" placeholder="Кол-во" style="margin-top:6px"></div><button class="btn btn-ghost" id="aStars">⭐ Выдать</button>' +
      '<button class="btn btn-danger" id="aClear">🗑 Очистить</button><button class="btn btn-ghost" id="aClose">Закрыть</button></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
    ov.querySelector('#aClose').onclick = function(){ ov.remove(); };
    ov.querySelector('#aCodes').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      var code = b.dataset.code, act = b.dataset.act;
      if(act === 'ban'){ api('/admin/ban', 'POST', { code: code, banned: !r.codes[code].banned }).then(function(){ ov.remove(); openAdmin(); }); }
      else if(act === 'del'){ if(!confirm('Удалить?')) return; api('/admin/delete', 'POST', { code: code }).then(function(res){ if(!res.ok){ toast(res.error || 'Ошибка'); return; } ov.remove(); openAdmin(); }); }
    });
    ov.querySelector('#aCreate').onclick = function(){
      var name = ov.querySelector('#aName').value.trim() || 'Новый';
      api('/admin/codes', 'POST', { name: name, isAdmin: false }).then(function(res){ if(res.ok){ toast('Код: ' + res.code); ov.remove(); openAdmin(); } });
    };
    ov.querySelector('#aStars').onclick = function(){
      var c = ov.querySelector('#aStarCode').value.trim().toUpperCase();
      var a = Number(ov.querySelector('#aStarAmt').value || 0);
      if(!c || !a) return toast('Заполни поля');
      api('/admin/stars', 'POST', { code: c, amount: a }).then(function(res){ if(res.ok){ toast('Начислено'); ov.remove(); } else toast('Ошибка'); });
    };
    ov.querySelector('#aClear').onclick = function(){
      if(!confirm('Удалить переписку?')) return;
      api('/admin/clear', 'POST').then(function(){ toast('Очищено'); ov.remove(); });
    };
  });
}

document.documentElement.dataset.theme = 'dark';
if(token){
  api('/users').then(function(r){
    if(!r.ok){ localStorage.removeItem(TOKEN_KEY); token = ''; return; }
    me = r.me; users = r.users; chats = r.chats || []; gifts = r.gifts || []; stories = r.stories || [];
    if(r.commission) GIFT_COMMISSION = r.commission;
    startApp();
  }).catch(function(){});
}
})();
</script>
</body>
</html>
